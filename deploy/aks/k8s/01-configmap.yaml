apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: ssc-app
data:
  # Application Configuration
  APP_NAME: "SSC Application"
  ENVIRONMENT: "production"
  DEBUG: "false"

  # Server Configuration
  HOST: "0.0.0.0"
  PORT: "8000"

  # Database Configuration
  DB_TYPE: "postgresql"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "appdb"
  DB_ECHO: "false"

  # MongoDB Configuration
  MONGO_URI: "mongodb://mongodb:27017"
  MONGO_DB_NAME: "appdb"

  # Redis Configuration
  REDIS_URL: "redis://redis:6379/0"

  # Authentication Settings
  ENABLE_MFA: "true"
  ENABLE_SOCIAL_AUTH: "true"

  # CORS Configuration
  CORS_ORIGINS: '["https://yourdomain.com","https://www.yourdomain.com"]'

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_API_REQUESTS: "100"
  RATE_LIMIT_API_WINDOW_MINUTES: "1"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: ssc-app
data:
  # Frontend environment variables (from full-version/.env)
  # NOTE: Update VITE_APP_API_URL to your production domain
  VITE_APP_API_URL: "https://yourdomain.com/api/v1"
  VITE_APP_VERSION: "3.5.1"
  VITE_APP_BASE_NAME: "/"
