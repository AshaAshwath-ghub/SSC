# Persistent Volume Claims for Databases
# These will use Azure Managed Disks

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: ssc-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-premium  # Azure Premium SSD
  resources:
    requests:
      storage: 20Gi  # Adjust based on needs

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: ssc-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-premium
  resources:
    requests:
      storage: 20Gi  # Adjust based on needs

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: ssc-app
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-premium
  resources:
    requests:
      storage: 5Gi  # Redis typically needs less

---
# Storage Classes available in AKS:
# - default: Azure Standard SSD (cheaper, slower)
# - managed-premium: Azure Premium SSD (faster, more expensive)
# - azurefile: Azure Files (for ReadWriteMany if needed)
