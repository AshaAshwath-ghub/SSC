services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: app-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # SQL Server database (alternative to PostgreSQL)
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: app-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    profiles:
      - sqlserver  # Only start with: docker-compose --profile sqlserver up

  # MongoDB
  mongodb:
    image: mongo:7-jammy
    container_name: app-mongodb
    environment:
      MONGO_INITDB_DATABASE: appdb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: app-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple  # Using simpler Dockerfile
    container_name: app-backend
    environment:
      # Application
      APP_NAME: "Application"
      ENVIRONMENT: "development"
      DEBUG: "true"

      # Database (PostgreSQL by default)
      DB_TYPE: "postgresql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_NAME: "appdb"

      # MongoDB
      MONGO_URI: "mongodb://mongodb:27017"
      MONGO_DB_NAME: "appdb"

      # Redis
      REDIS_URL: "redis://redis:6379/0"

      # Security (CHANGE THESE IN PRODUCTION!)
      SECRET_KEY: "dev-secret-key-change-in-production"
      JWT_SECRET_KEY: "dev-jwt-secret-key-change-in-production"
      JWT_ALGORITHM: "HS256"

      # CORS
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'

      # Logging
      LOG_LEVEL: "INFO"

    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app  # Mount code for hot-reload
      - ./backend/alembic:/app/alembic  # Mount alembic for migrations
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./full-version
      dockerfile: ../deploy/docker/Dockerfile.frontend
    container_name: app-frontend
    environment:
      VITE_APP_API_URL: "http://localhost:8000/api/v1"
    ports:
      - "3000:3000"
    volumes:
      - ./full-version/src:/app/src  # Mount source for hot-reload
      - ./full-version/public:/app/public
    networks:
      - app-network
    command: npm run start
    profiles:
      - frontend  # Only start with: docker-compose --profile frontend up

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  sqlserver_data:
  mongodb_data:
  redis_data:
